<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle Rush — a fast kitchen cooking game</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main>
  <canvas id="game" width="1280" height="800" aria-label="Sizzle Rush: take orders, chop and grill ingredients, plate dishes and serve them before the timer runs out"></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="hint">WASD / arrows or click to move &middot; E: use a station &middot; P: pause &middot; M: mute &middot; Serve exact recipes before their timers run out. 3 late orders ends the shift.</p>
</main>
<script type="module" src="./js/main.js"></script>
</body>
</html>
